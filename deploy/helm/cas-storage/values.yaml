image:
  repository: ghcr.io/m-szalik/cas-storage
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Enable DELETE /objects/{hash} (STORAGE_ALLOW_DELETE).
allowDelete: false
# Store text objects gzipped (STORAGE_COMPRESS).
compress: false

# The config.yaml (namespaces and API keys), stored in a Secret. With no keys
# the service starts but answers 401 to everything except /healthz. Example:
#
#   config:
#     max_upload_size: 500MB
#     namespaces:
#       docs: {}
#       images:
#         max_upload_size: 2GiB
#     keys:
#       - key: "a-long-random-secret"
#         namespace: docs
#         permissions: [READ, CREATE, DELETE, LABEL]
config:
  max_upload_size: 500MB
  namespaces: {}
  keys: []

# Name of an existing Secret with a config.yaml key; when set, `config` is
# ignored and no Secret is created (keeps the API keys out of the values).
existingSecret: ""

# One volume holds every namespace (STORAGE_DIR=/data). The service is a
# single replica: two pods must never write the same directory.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Extra environment variables for the container.
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
